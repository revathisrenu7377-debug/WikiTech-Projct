<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WikiSense</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; width: 320px; padding: 16px; background: #fff; color: #0f172a; }
      .logo { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
      .logo svg { color: #667eea; }
      h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
      .subtitle { font-size: 13px; color: #64748b; margin-bottom: 20px; }
      .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 150ms; border: none; }
      .btn-primary { background: #667eea; color: white; }
      .btn-primary:hover { background: #5a6fd6; }
      .btn-secondary { background: #f1f5f9; color: #475569; }
      .btn-secondary:hover { background: #e2e8f0; }
      .features { margin-top: 20px; }
      .feature { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 13px; color: #475569; }
      .feature svg { color: #667eea; flex-shrink: 0; }
      .divider { height: 1px; background: #e2e8f0; margin: 16px 0; }
      .footer { text-align: center; font-size: 11px; color: #94a3b8; }
      .footer a { color: #667eea; }
    </style>
  </head>
  <body>
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
        <path d="M2 17l10 5 10-5"></path>
        <path d="M2 12l10 5 10-5"></path>
      </svg>
      <span>WikiSense</span>
    </div>
    <h1>Wikipedia AI Assistant</h1>
    <p class="subtitle">Summarize, chat, fact-check, and explore citations on any Wikipedia page.</p>

    <button class="btn btn-primary" id="open-panel">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2"></rect>
        <line x1="8" y1="21" x2="16" y2="21"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
      Open Side Panel
    </button>

    <div class="divider"></div>

    <div class="features">
      <div class="feature">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <span>Chat with articles</span>
      </div>
      <div class="feature">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        <span>Smart summaries</span>
      </div>
      <div class="feature">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22h8a2 2 0 0 0 2-2V7l-5-5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line></svg>
        <span>Citation tracking</span>
      </div>
      <div class="feature">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        <span>Fact-checking</span>
      </div>
    </div>

    <div class="footer">
      <a href="https://github.com" target="_blank">GitHub</a> · 
      <a href="#" id="options-link">Options</a>
    </div>

    <script>
      document.getElementById('open-panel').addEventListener('click', () => {
        chrome.sidePanel.open({ windowId: chrome.windows.WINDOW_ID_CURRENT });
        window.close();
      });

      document.getElementById('options-link').addEventListener('click', (e) => {
        e.preventDefault();
        chrome.runtime.openOptionsPage();
      });
    </script>
  </body>
</html>
